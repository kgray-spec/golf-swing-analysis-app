<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Swing">
<title>Swing — Golf Swing Analysis</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon.svg">
<link rel="icon" href="assets/icon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ───────────────────────── Top bar ───────────────────────── -->
<header class="bar bar--top" id="topBar">
  <div class="bar__left">
    <button class="btn btn--plain" id="btnLibrary" title="Load videos">
      <svg viewBox="0 0 24 24" class="ico"><path d="M12 4v16M4 12h16"/></svg>
      <span class="btn__label">Load</span>
    </button>
  </div>

  <div class="segmented" id="layoutSeg" role="tablist" aria-label="Layout">
    <button class="seg" data-layout="single"  data-short="1 Up" role="tab" aria-selected="true">Single</button>
    <button class="seg" data-layout="split"   data-short="2 Up" role="tab" aria-selected="false">Split</button>
    <button class="seg" data-layout="pip"     data-short="PiP"  role="tab" aria-selected="false">PiP</button>
    <button class="seg" data-layout="overlay" data-short="Ghost" role="tab" aria-selected="false">Ghost</button>
    <div class="seg__thumb" id="segThumb"></div>
  </div>

  <div class="bar__right">
    <button class="btn btn--plain" id="btnNativePip" title="Float video (Picture in Picture)">
      <svg viewBox="0 0 24 24" class="ico"><rect x="3" y="5" width="18" height="14" rx="2.5"/><rect x="12.5" y="12" width="7" height="5.5" rx="1.5"/></svg>
    </button>
  </div>
</header>

<!-- ───────────────────────── Stage ───────────────────────── -->
<main class="stage" id="stage" data-layout="single">

  <section class="deck" id="deckA" data-deck="A">
    <div class="deck__view">
      <video class="deck__video" playsinline webkit-playsinline preload="auto"></video>
      <canvas class="deck__canvas"></canvas>
    </div>
    <div class="deck__empty">
      <svg viewBox="0 0 24 24" class="ico ico--xl"><path d="M12 5v14M5 12h14"/></svg>
      <p>Add swing A</p>
    </div>
    <div class="deck__tag"><span class="deck__badge">A</span><span class="deck__name">—</span></div>
    <input type="file" accept="video/*" class="deck__file" hidden>
  </section>

  <div class="divider" id="divider" aria-hidden="true"></div>

  <section class="deck" id="deckB" data-deck="B">
    <div class="deck__view">
      <video class="deck__video" playsinline webkit-playsinline preload="auto"></video>
      <canvas class="deck__canvas"></canvas>
    </div>
    <div class="deck__empty">
      <svg viewBox="0 0 24 24" class="ico ico--xl"><path d="M12 5v14M5 12h14"/></svg>
      <p>Add swing B</p>
    </div>
    <div class="deck__tag"><span class="deck__badge deck__badge--b">B</span><span class="deck__name">—</span></div>
    <input type="file" accept="video/*" class="deck__file" hidden>
  </section>

  <!-- overlay opacity control, only in overlay mode -->
  <div class="floating floating--overlay" id="overlayCtl">
    <span class="floating__label">B</span>
    <input type="range" class="slider slider--slim" id="overlayOpacity" min="0" max="100" value="50">
    <button class="chip chip--sm" id="blendToggle" data-blend="normal">Blend</button>
  </div>

  <div class="rec-badge" id="recBadge"><span class="rec-dot rec-dot--live"></span><span id="recTime">0:00</span></div>

  <div class="webcam" id="webcamBubble" data-shape="circle" hidden>
    <video class="webcam__video" autoplay muted playsinline></video>
    <button class="webcam__shape" id="webcamShapeBtn" title="Switch shape">
      <svg viewBox="0 0 24 24" class="ico ico--sm"><rect x="4" y="4" width="16" height="16" rx="4"/></svg>
    </button>
  </div>
</main>

<!-- ───────────────────────── Tool rail ───────────────────────── -->
<aside class="rail" id="rail">
  <div class="rail__group" id="zoomGroup">
    <button class="tool" data-tool="hand" title="Hand — drag to move the video (H)"><svg viewBox="0 0 24 24" class="ico"><path d="M7 11.5V5a1.5 1.5 0 0 1 3 0v5.5"/><path d="M10 10.5V4a1.5 1.5 0 0 1 3 0v6.5"/><path d="M13 10.5V5a1.5 1.5 0 0 1 3 0v7"/><path d="M16 12V8.5a1.5 1.5 0 0 1 3 0V15c0 3.9-2.6 6.5-6.5 6.5S6 18.9 6 15v-1.5l-1.8-2.7a1.3 1.3 0 0 1 2.1-1.5L7 11"/></svg></button>
    <button class="tool" id="btnZoomIn" title="Zoom in (+)"><svg viewBox="0 0 24 24" class="ico"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.35-4.35M10.5 8v5M8 10.5h5"/></svg></button>
    <button class="tool" id="btnZoomOut" title="Zoom out (-)"><svg viewBox="0 0 24 24" class="ico"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.35-4.35M8 10.5h5"/></svg></button>
    <button class="tool" id="btnZoomReset" title="Reset zoom (0)"><svg viewBox="0 0 24 24" class="ico"><path d="M8 4H4v4M16 4h4v4M4 16v4h4M20 16v4h-4"/></svg></button>
  </div>

  <div class="rail__group" id="toolGroup">
    <button class="tool is-active" data-tool="pen"    title="Freehand (P)"><svg viewBox="0 0 24 24" class="ico"><path d="M4 20l4-1 10-10a2.1 2.1 0 0 0-3-3L5 16z"/></svg></button>
    <button class="tool" data-tool="line"   title="Line (L)"><svg viewBox="0 0 24 24" class="ico"><path d="M5 19L19 5"/></svg></button>
    <button class="tool" data-tool="arrow"  title="Arrow (W)"><svg viewBox="0 0 24 24" class="ico"><path d="M5 19L18 6"/><path d="M18 6h-6.5M18 6v6.5"/></svg></button>
    <button class="tool" data-tool="circle" title="Circle (O)"><svg viewBox="0 0 24 24" class="ico"><circle cx="12" cy="12" r="7.5"/></svg></button>
    <button class="tool" data-tool="rect"   title="Box (B)"><svg viewBox="0 0 24 24" class="ico"><rect x="4.5" y="6" width="15" height="12" rx="1.5"/></svg></button>
    <button class="tool" data-tool="angle"  title="Angle (A)"><svg viewBox="0 0 24 24" class="ico"><path d="M5 19h14M5 19L15 6"/></svg></button>
  </div>

  <div class="rail__group rail__group--colors" id="colorGroup"></div>

  <div class="rail__group rail__group--weights" id="weightGroup">
    <button class="weight" data-weight="0.6" title="Thin line"><span class="weight__dot" style="width:6px;height:6px"></span></button>
    <button class="weight is-active" data-weight="1" title="Medium line"><span class="weight__dot" style="width:9px;height:9px"></span></button>
    <button class="weight" data-weight="1.7" title="Thick line"><span class="weight__dot" style="width:13px;height:13px"></span></button>
  </div>

  <div class="rail__group">
    <button class="tool" id="btnUndo" title="Undo (U)"><svg viewBox="0 0 24 24" class="ico"><path d="M9 10H5V6"/><path d="M5.5 10.5A7 7 0 1 1 5 14"/></svg></button>
    <button class="tool" id="btnClear" title="Clear drawings (C)"><svg viewBox="0 0 24 24" class="ico"><path d="M6 7h12M9 7V5h6v2M8 7l1 12h6l1-12"/></svg></button>
  </div>
</aside>

<!-- ───────────────────────── Transport ───────────────────────── -->
<footer class="bar bar--bottom" id="transport">

  <div class="scrub">
    <span class="time" id="timeNow">0:00.00</span>
    <div class="scrub__track" id="scrubTrack">
      <div class="scrub__fill" id="scrubFill"></div>
      <div class="scrub__knob" id="scrubKnob"></div>
    </div>
    <span class="time time--dim" id="timeEnd">0:00.00</span>
  </div>

  <div class="transport">
    <button class="tbtn" id="btnStepBack" title="Previous frame (←)">
      <svg viewBox="0 0 24 24" class="ico"><path d="M15 5L8 12l7 7M6 5v14"/></svg>
    </button>

    <button class="tbtn tbtn--primary" id="btnPlay" title="Play / pause (Space)">
      <svg viewBox="0 0 24 24" class="ico ico--fill" id="icoPlay"><path d="M8 5.5l11 6.5-11 6.5z"/></svg>
      <svg viewBox="0 0 24 24" class="ico ico--fill hidden" id="icoPause"><path d="M8 5h3.2v14H8zM12.8 5H16v14h-3.2z"/></svg>
    </button>

    <button class="tbtn" id="btnStepFwd" title="Next frame (→)">
      <svg viewBox="0 0 24 24" class="ico"><path d="M9 5l7 7-7 7M18 5v14"/></svg>
    </button>

    <div class="speeds" id="speeds">
      <button class="chip" data-speed="0.1">.1×</button>
      <button class="chip" data-speed="0.25">¼×</button>
      <button class="chip" data-speed="0.5">½×</button>
      <button class="chip is-active" data-speed="1">1×</button>
    </div>

    <button class="chip chip--wide is-active" id="btnSync" title="Link both videos (S)">
      <svg viewBox="0 0 24 24" class="ico ico--sm"><path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/></svg>
      <span>Linked</span>
    </button>

    <button class="chip chip--wide" id="btnFps" title="Source frame rate">30 fps</button>
    <button class="chip chip--wide" id="btnMic" title="Record microphone">
      <svg viewBox="0 0 24 24" class="ico ico--sm"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      <span>Mic</span>
    </button>
    <button class="chip chip--wide" id="btnWebcam" title="Show your face on screen">
      <svg viewBox="0 0 24 24" class="ico ico--sm"><circle cx="12" cy="9" r="3.4"/><path d="M5 20c0-3.6 3.1-6.2 7-6.2s7 2.6 7 6.2"/></svg>
      <span>Face</span>
    </button>

    <button class="btn btn--rec" id="btnRecord" title="Record lesson">
      <span class="rec-dot"></span><span class="btn__label" id="recLabel">Record</span>
    </button>
  </div>
</footer>

<!-- ───────────────────────── Sheets ───────────────────────── -->
<div class="scrim" id="scrim"></div>

<div class="sheet" id="sheetLoad">
  <div class="sheet__grab"></div>
  <h2 class="sheet__title">Load a swing</h2>
  <button class="row" data-target="A" data-mode="file"><span class="row__badge">A</span>Choose video for A<span class="row__chev">›</span></button>
  <button class="row" data-target="B" data-mode="file"><span class="row__badge row__badge--b">B</span>Choose video for B<span class="row__chev">›</span></button>
  <button class="row row--sub" data-mode="swap">Swap A and B</button>
  <button class="row row--sub" data-mode="clearAll">Remove both videos</button>

  <div class="lib" id="libSection">
    <div class="lib__head">
      <h3 class="lib__title">Incoming swings <span class="lib__count" id="libCount"></span></h3>
      <button class="chip chip--sm" id="libSync">Sync now</button>
    </div>
    <p class="lib__status" id="libStatus"></p>
    <div class="lib__list" id="libList">
      <p class="lib__empty">Nothing here yet.</p>
    </div>
  </div>

  <button class="row row--cancel" data-mode="cancel">Cancel</button>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
